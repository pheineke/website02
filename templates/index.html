<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Hub</title>
    
    <!-- Font Awesome for icons, consistent with the planner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

    <style>
        :root {
            /* Using the exact same style variables as the planner */
            --primary: #34495e;
            --light-bg: #f4f6f7;
            --border: #daddde;
            --text: #2c3e50;
            --link-hover: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            color: var(--text);
            background-color: var(--light-bg);
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 40px;
            color: var(--primary);
            font-weight: 300;
            font-size: 42px;
        }

        /* --- Hub Navigation Grid --- */
        .hub-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap; /* Allows cards to stack on smaller screens */
        }

        /* --- Individual App Card Styling --- */
        .hub-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
            padding: 30px;
            width: 300px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            -webkit-tap-highlight-color: transparent; /* Removes mobile tap highlight */
        }

        .hub-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(44, 62, 80, 0.15);
        }

        .hub-card .icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 20px;
            transition: color 0.2s ease;
        }

        .hub-card:hover .icon {
            color: var(--link-hover);
        }

        .hub-card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .hub-card p {
            font-size: 15px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Productivity Hub</h1>

        <div class="hub-nav">
            <!-- Link to the Weekly Planner -->
            <a href="{{ url_for('weekly_planner') }}" class="hub-card">
                <div class="icon">
                    <i class="fas fa-calendar-week"></i>
                </div>
                <h2>Weekly Planner</h2>
                <p>Visualize your week, manage tasks, and stay organized.</p>
            </a>

            <!-- Link to the Pomodoro Timer -->
            <a href="{{ url_for('pomodoro') }}" class="hub-card">
                <div class="icon">
                    <i class="fas fa-stopwatch-20"></i>
                </div>
                <h2>Pomodoro Timer</h2>
                <p>Boost your focus with the Pomodoro Technique. Work in timed intervals.</p>
            </a>
        </div>
    </div>
</body>
</html>
